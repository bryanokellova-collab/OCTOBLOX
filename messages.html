<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Octoblox - Messages</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:700,400&display=swap" rel="stylesheet">
    <style>body{margin:0;font-family:'Roboto',Arial,sans-serif;background:#18191a;color:#fff;} .navbar{background:#23272a;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;} .navbar .logo{font-size:2rem;font-weight:700;color:#00c3ff;letter-spacing:2px;} .navbar nav a{color:#fff;text-decoration:none;margin-left:2rem;font-weight:500;transition:color 0.2s;} .navbar nav a:hover{color:#00c3ff;} .messages-section{max-width:500px;margin:4rem auto;background:#23272a;padding:2rem;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.2);} .messages-section h1{color:#00c3ff;font-size:2rem;margin-bottom:1rem;text-align:center;} .messages-section form{margin-top:2rem;} .messages-section label{color:#ccc;display:block;margin-bottom:0.5rem;} .messages-section input,.messages-section textarea{width:100%;padding:0.7rem;margin-bottom:1rem;border-radius:5px;border:none;background:#18191a;color:#fff;} .messages-section button{width:100%;padding:0.8rem;background:#00c3ff;color:#18191a;font-weight:700;border:none;border-radius:5px;font-size:1rem;cursor:pointer;transition:background 0.2s;} .messages-section button:hover{background:#0099cc;} .footer{background:#23272a;text-align:center;padding:1rem;color:#aaa;font-size:0.9rem;} </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">Octoblox</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="games.html">Games</a>
            <a href="avatar.html">Avatar Shop</a>
            <a href="octobux.html">Get Octobux</a>
            <a href="jobs.html">Jobs</a>
            <a href="admin.html">Admin Panel</a>
            <a href="moderator.html">Moderator Panel</a>
            <a href="messages.html">Messages</a>
            <a href="login.html">Login</a>
        </nav>
    </div>
    <div class="messages-section">
        <h1>Send a Message</h1>
        <form>
            <label for="to-username">To Username</label>
            <input type="text" id="to-username" name="to-username" required>
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="4" required></textarea>
            <button type="submit">Send</button>
        </form>
        <script>
        document.querySelector('.messages-section form').addEventListener('submit',function(e){
            e.preventDefault();
            alert('Message sent!');
        });
        </script>
        </form>
    </div>
    <div class="footer">&copy; 2025 Octoblox. Not affiliated with Roblox Corporation.</div>
</body>
</html>
