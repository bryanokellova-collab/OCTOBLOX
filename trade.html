<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Octoblox - Trade</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:700,400&display=swap" rel="stylesheet">
    <style>
        body {margin:0;font-family:'Roboto',Arial,sans-serif;background:#18191a;color:#fff;}
        .navbar{background:#23272a;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
        .navbar .logo{font-size:2rem;font-weight:700;color:#00c3ff;letter-spacing:2px;}
        .navbar nav a{color:#fff;text-decoration:none;margin-left:2rem;font-weight:500;transition:color 0.2s;}
        .navbar nav a:hover{color:#00c3ff;}
        .trade-section{max-width:700px;margin:4rem auto;background:#23272a;padding:2rem;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.2);}
        .trade-header{font-size:2rem;color:#00c3ff;margin-bottom:2rem;text-align:center;}
        .trade-form{display:flex;flex-direction:column;gap:1rem;max-width:400px;margin:0 auto;}
        .trade-form label{color:#ccc;}
        .trade-form input, .trade-form select{padding:0.7rem;border-radius:5px;border:none;background:#18191a;color:#fff;}
        .trade-form button{padding:0.8rem;background:#00c3ff;color:#18191a;font-weight:700;border:none;border-radius:5px;font-size:1.1rem;cursor:pointer;transition:background 0.2s;}
        .trade-form button:hover{background:#0099cc;}
        .footer{background:#23272a;text-align:center;padding:1rem;color:#aaa;font-size:0.9rem;margin-top:3rem;}
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">Octoblox</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="profile.html">Profile</a>
            <a href="messages.html">Messages</a>
            <a href="avatar.html">Avatar</a>
            <a href="inventory.html">Inventory</a>
            <a href="trade.html">Trade</a>
            <a href="communities.html">Communities</a>
            <a href="blog.html">Blog</a>
            <a href="store.html">Official Store</a>
            <a href="giftcards.html">Gift Cards</a>
            <a href="login.html">Login</a>
        </nav>
    </div>
    <div class="trade-section">
        <div class="trade-header">Trade Items</div>
        <form class="trade-form">
            <label for="trade-user">Trade with (username):</label>
            <input type="text" id="trade-user" name="trade-user" required>
            <label for="trade-item">Select item to trade:</label>
            <select id="trade-item" name="trade-item">
                <option>Item 1</option>
                <option>Item 2</option>
                <option>Item 3</option>
            </select>
            <button type="submit">Send Trade Request</button>
        </form>
    </div>
    <div class="footer">&copy; 2025 Octoblox. Not affiliated with Roblox Corporation.</div>
</body>
</html>
