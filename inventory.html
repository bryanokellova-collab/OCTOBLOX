<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Octoblox - Inventory</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:700,400&display=swap" rel="stylesheet">
    <style>
        body {margin:0;font-family:'Roboto',Arial,sans-serif;background:#18191a;color:#fff;}
        .navbar{background:#23272a;padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;}
        .navbar .logo{font-size:2rem;font-weight:700;color:#00c3ff;letter-spacing:2px;}
        .navbar nav a{color:#fff;text-decoration:none;margin-left:2rem;font-weight:500;transition:color 0.2s;}
        .navbar nav a:hover{color:#00c3ff;}
        .inventory-section{max-width:800px;margin:4rem auto;background:#23272a;padding:2rem;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.2);}
        .inventory-header{font-size:2rem;color:#00c3ff;margin-bottom:2rem;text-align:center;}
        .inventory-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:2rem;}
        .inventory-item{background:#18191a;border-radius:8px;padding:1.5rem;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.15);color:#fff;}
        .inventory-item h3{margin:0.5rem 0;color:#00c3ff;}
        .inventory-item p{color:#ccc;font-size:1rem;}
        .footer{background:#23272a;text-align:center;padding:1rem;color:#aaa;font-size:0.9rem;margin-top:3rem;}
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">Octoblox</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="profile.html">Profile</a>
            <a href="messages.html">Messages</a>
            <a href="avatar.html">Avatar</a>
            <a href="inventory.html">Inventory</a>
            <a href="trade.html">Trade</a>
            <a href="communities.html">Communities</a>
            <a href="blog.html">Blog</a>
            <a href="store.html">Official Store</a>
            <a href="giftcards.html">Gift Cards</a>
            <a href="login.html">Login</a>
        </nav>
    </div>
    <div class="inventory-section">
        <div class="inventory-header">Your Inventory</div>
        <div class="inventory-list">
            <div class="inventory-item">
                <h3>Item 1</h3>
                <p>Description of item 1.</p>
            </div>
            <div class="inventory-item">
                <h3>Item 2</h3>
                <p>Description of item 2.</p>
            </div>
            <div class="inventory-item">
                <h3>Item 3</h3>
                <p>Description of item 3.</p>
            </div>
        </div>
    </div>
    <div class="footer">&copy; 2025 Octoblox. Not affiliated with Roblox Corporation.</div>
</body>
</html>
